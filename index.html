<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KotakEngine</title>
    <style>
        body { 
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace; 
            background: #0a0a0a; 
            color: white; 
            margin: 0; padding: 0;
            height: 100vh; width: 100vw;
            overflow: hidden; 
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; 
        }

        #loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a0a; display: flex; flex-direction: column;
            align-items: center; z-index: 100; padding: 40px 0; box-sizing: border-box;
        }

        #loader-logo { 
            max-width: 150px; height: auto; 
            margin-top: auto; margin-bottom: auto; 
            transition: filter 0.7s ease-in-out, transform 0.7s ease-in-out;
            filter: brightness(1) grayscale(0);
        }

        #loader-text { 
            font-size: 1.1rem; color: #00c853; margin-bottom: 15px; 
            text-shadow: 0 0 5px #00c853; text-align: center;
            transition: all 0.5s ease;
        }

        .progress-container { 
            width: 250px; height: 6px; background: #1a1a1a; 
            border-radius: 10px; overflow: hidden; border: 1px solid #333; margin-bottom: 20px;
        }

        #progress-bar { 
            height: 100%; width: 0%; background: #00c853; 
            box-shadow: 0 0 10px #00c853; 
            transition: width 0.15s ease-out; 
        }

        /* Živý odpočet pod textem */
        #countdown-box {
            display: none;
            font-size: 0.95rem;
            color: #888;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        /* --- STAV ÚDRŽBY / CHYBY (SYTĚ ČERVENÁ) --- */
        .logo-maintenance {
            filter: grayscale(100%) sepia(100%) saturate(10000%) hue-rotate(320deg) brightness(1.2) drop-shadow(0 0 20px #ff0000) !important;
            transform: scale(1.05); 
        }

        .bar-maintenance {
            background: #ff0000 !important;
            box-shadow: 0 0 15px #ff0000 !important;
            transition: background 0.5s ease-in-out !important;
        }

        /* --- HLAVNÍ OBSAH A ANIMACE VYJETÍ NAHORU --- */
        #main-content {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0a0a0a;
            z-index: 200; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transform: translateY(100%); 
        }

        .slide-up {
            display: flex !important;
            animation: slideUpAnim 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes slideUpAnim {
            0% { transform: translateY(100%); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Načítací brána (Gateway) -->
    <div id="loader-overlay">
        <img src="logo.png" alt="Logo" id="loader-logo">
        <div id="loader-text">KotakEngine - Inicializace [0]%</div>
        <div class="progress-container"><div id="progress-bar"></div></div>
        <div id="countdown-box">Termination for: <span id="countdown-timer">--:--:--:--</span></div>
    </div>

    <!-- Zde začíná tvůj skutečný obsah webu -->
    <div id="main-content">
        <h1>Vítej v KotakEngine</h1>
        <p>Aplikace byla úspěšně inicializována a načtena.</p>
    </div>

    <!-- Logika ovládání přes JSON -->
    <script>
        (function() {
            const progressBar = document.getElementById('progress-bar');
            const loaderText = document.getElementById('loader-text');
            const loaderLogo = document.getElementById('loader-logo'); 
            const countdownBox = document.getElementById('countdown-box');
            const countdownTimer = document.getElementById('countdown-timer');

            let countdownInterval;

            // Pomocná funkce pro převod formátu "DD MM YYYY HH:mm" na Date Objekt
            function parseDateString(str) {
                if (!str) return null;
                const parts = str.split(' ');
                if (parts.length !== 4) return null;
                const day = parseInt(parts[0], 10);
                const month = parseInt(parts[1], 10) - 1;
                const year = parseInt(parts[2], 10);
                const timeParts = parts[3].split(':');
                const hours = parseInt(timeParts[0], 10);
                const minutes = parseInt(timeParts[1], 10);
                return new Date(year, month, day, hours, minutes);
            }

            // Funkce pro plynulou animaci progress baru
            function simulateLoading(target, textPrefix = "KotakEngine - Načítání") {
                return new Promise((resolve) => {
                    let progress = parseInt(progressBar.style.width) || 0;
                    const interval = setInterval(() => {
                        progress += Math.floor(Math.random() * 8) + 4;
                        if (progress >= target) {
                            progress = target;
                            clearInterval(interval);
                            resolve();
                        }
                        progressBar.style.width = progress + '%';
                        loaderText.innerText = `${textPrefix} [${progress}]%`;
                    }, 80);
                });
            }

            // Živý odpočet času na obrazovce
            function startCountdown(targetTime) {
                countdownBox.style.display = "block";

                function updateTimer() {
                    const now = new Date().getTime();
                    const distance = targetTime - now;

                    if (distance < 0) {
                        clearInterval(countdownInterval);
                        countdownTimer.innerText = "00:00:00:00";
                        window.location.reload();
                        return;
                    }

                    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                    const dStr = String(days).padStart(2, '0');
                    const hStr = String(hours).padStart(2, '0');
                    const mStr = String(minutes).padStart(2, '0');
                    const sStr = String(seconds).padStart(2, '0');

                    countdownTimer.innerText = `${dStr}d ${hStr}h ${mStr}m ${sStr}s`;
                }

                updateTimer();
                countdownInterval = setInterval(updateTimer, 1000);
            }

            // Zapnutí červeného údržbového módu
            function triggerMaintenanceMode(text, targetTime, showCountdown) {
                setTimeout(() => {
                    loaderLogo.classList.add('logo-maintenance');
                    progressBar.classList.add('bar-maintenance');
                    loaderText.innerText = text;
                    loaderText.style.color = "#ff0000";
                    loaderText.style.textShadow = "0 0 10px #ff0000";
                    
                    if (showCountdown && targetTime) {
                        startCountdown(targetTime.getTime());
                    }
                }, 100);
            }

            async function init() {
                try {
                    // První fáze loadingu
                    await simulateLoading(35);

                    // Načtení JSON konfigurace z externího souboru
                    const response = await fetch('maintenance.json?t=' + Date.now());
                    if (!response.ok) throw new Error();
                    const data = await response.json();

                    const now = new Date();
                    const startTime = parseDateString(data.start);
                    const endTime = parseDateString(data.end);

                    let isMaintenance = false;
                    let statusText = "MAINTENANCE MODE";

                    // 1. Kontrola vynucené údržby
                    if (data.forced === true) {
                        isMaintenance = true;
                    }
                    // 2. Kontrola plánované údržby podle času
                    else if (startTime && endTime && now >= startTime && now <= endTime) {
                        isMaintenance = true;
                        const options = { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' };
                        statusText = `ÚDRŽBA DO ${endTime.toLocaleDateString('cs-CZ', options)}`;
                    }

                    // Vyhodnocení stavu
                    if (isMaintenance) {
                        await simulateLoading(100, "Prověřování systému");
                        const showCountdown = (data["show-endtime"] && endTime && endTime > now);
                        triggerMaintenanceMode(statusText, endTime, showCountdown);
                        return; 
                    }

                    // Pokud údržba neběží, dojedeme do 100%
                    await simulateLoading(100);
                    
                    // Spustíme animaci vyjetí hlavního webu nahoru přes loader
                    const mainContent = document.getElementById('main-content');
                    if (mainContent) {
                        mainContent.classList.add('slide-up');
                    }

                } catch (e) {
                    // Fallback při chybě sítě nebo chybějícím JSONu
                    progressBar.style.width = '100%';
                    triggerMaintenanceMode("CHYBA SYSTÉMU", null, false);
                }
            }

            window.onload = init;
        })();
    </script>
</body>
</html>
