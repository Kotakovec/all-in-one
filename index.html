<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KotakEngine</title>
    <style>
        body { 
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace; 
            background: #0a0a0a; 
            color: white; 
            margin: 0; padding: 0;
            height: 100vh; width: 100vw;
            overflow: hidden; 
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; 
        }

        #loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a0a; display: flex; flex-direction: column;
            align-items: center; z-index: 100; padding: 40px 0; box-sizing: border-box;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #loader-logo { 
            max-width: 150px; height: auto; 
            margin-top: auto; margin-bottom: auto; 
            transition: filter 0.7s ease-in-out, transform 0.7s ease-in-out;
            filter: brightness(1) grayscale(0);
        }

        #loader-text { 
            font-size: 1.1rem; color: #00c853; margin-bottom: 15px; 
            text-shadow: 0 0 5px #00c853; text-align: center;
            transition: all 0.5s ease;
        }

        .progress-container { 
            width: 250px; height: 6px; background: #1a1a1a; 
            border-radius: 10px; overflow: hidden; border: 1px solid #333; margin-bottom: 20px;
        }

        #progress-bar { 
            height: 100%; width: 0%; background: #00c853; 
            box-shadow: 0 0 10px #00c853; 
            transition: width 0.15s ease-out, background 0.5s ease-in-out, box-shadow 0.5s ease-in-out; 
        }

        /* Živý odpočet pod textem */
        #countdown-box {
            display: none;
            font-size: 0.95rem;
            color: #888;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        /* --- STAV ÚDRŽBY / CHYBY (SYTĚ ČERVENÁ) --- */
        .logo-maintenance {
            filter: grayscale(100%) sepia(100%) saturate(10000%) hue-rotate(320deg) brightness(1.2) drop-shadow(0 0 20px #ff0000) !important;
            transform: scale(1.05); 
        }

        .bar-maintenance {
            background: #ff0000 !important;
            box-shadow: 0 0 15px #ff0000 !important;
        }

        /* --- HLAVNÍ OBSAH WEBU --- */
        #main-content {
            display: none;
            width: 100%; height: 100%;
            background: #0a0a0a;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Třída pro odsunutí loaderu nahoru pryč z obrazovky */
        .loader-hide {
            transform: translateY(-100%);
        }
    </style>
</head>
<body>

    <!-- Načítací brána (Gateway) -->
    <div id="loader-overlay">
        <img src="logo.png" alt="Logo" id="loader-logo">
        <div id="loader-text">KotakEngine - Inicializace [0]%</div>
        <div class="progress-container"><div id="progress-bar"></div></div>
        <div id="countdown-box">Termination for: <span id="countdown-timer">--:--:--:--</span></div>
    </div>

    <!-- Zde začíná tvůj skutečný obsah webu -->
    <div id="main-content">
        <h1>Vítej v KotakEngine</h1>
        <p>Aplikace byla úspěšně inicializována a načtena.</p>
    </div>

    <script>
        (function() {
            const loaderOverlay = document.getElementById('loader-overlay');
            const progressBar = document.getElementById('progress-bar');
            const loaderText = document.getElementById('loader-text');
            const loaderLogo = document.getElementById('loader-logo'); 
            const countdownBox = document.getElementById('countdown-box');
            const countdownTimer = document.getElementById('countdown-timer');
            const mainContent = document.getElementById('main-content');

            let countdownInterval;
            let checkStatusInterval;
            let isInitiallyLoaded = false;
            let currentMaintenanceState = false;

            // Pomocná funkce pro převod formátu "DD MM YYYY HH:mm" na Date Objekt
            function parseDateString(str) {
                if (!str) return null;
                const parts = str.split(' ');
                if (parts.length !== 4) return null;
                const day = parseInt(parts[0], 10);
                const month = parseInt(parts[1], 10) - 1;
                const year = parseInt(parts[2], 10);
                const timeParts = parts[3].split(':');
                const hours = parseInt(timeParts[0], 10);
                const minutes = parseInt(timeParts[1], 10);
                return new Date(year, month, day, hours, minutes);
            }

            // Funkce pro plynulou animaci progress baru
            function simulateLoading(target, textPrefix = "KotakEngine - Načítání") {
                return new Promise((resolve) => {
                    let progress = parseInt(progressBar.style.width) || 0;
                    if (progress >= target) return resolve();
                    
                    const interval = setInterval(() => {
                        progress += Math.floor(Math.random() * 8) + 4;
                        if (progress >= target) {
                            progress = target;
                            clearInterval(interval);
                            resolve();
                        }
                        progressBar.style.width = progress + '%';
                        loaderText.innerText = `${textPrefix} [${progress}]%`;
                    }, 80);
                });
            }

            // Živý odpočet času na obrazovce
            function startCountdown(targetTime) {
                if (countdownInterval) clearInterval(countdownInterval);
                countdownBox.style.display = "block";

                function updateTimer() {
                    const now = new Date().getTime();
                    const distance = targetTime - now;

                    if (distance < 0) {
                        clearInterval(countdownInterval);
                        countdownTimer.innerText = "00:00:00:00";
                        // Po vypršení času vynutíme okamžitou re-kontrolu sítě
                        checkSystemStatus();
                        return;
                    }

                    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                    const dStr = String(days).padStart(2, '0');
                    const hStr = String(hours).padStart(2, '0');
                    const mStr = String(minutes).padStart(2, '0');
                    const sStr = String(seconds).padStart(2, '0');

                    countdownTimer.innerText = `${dStr}d ${hStr}h ${mStr}m ${sStr}s`;
                }

                updateTimer();
                countdownInterval = setInterval(updateTimer, 1000);
            }

            // Aktivace červeného módu údržby (zablokování / vykopnutí)
            function enableMaintenanceView(text, targetTime, showCountdown) {
                // Schováme hlavní obsah a vrátíme loader na scénu
                mainContent.style.display = 'none';
                loaderOverlay.classList.remove('loader-hide');

                loaderLogo.classList.add('logo-maintenance');
                progressBar.classList.add('bar-maintenance');
                progressBar.style.width = '100%';
                
                loaderText.innerText = text;
                loaderText.style.color = "#ff0000";
                loaderText.style.textShadow = "0 0 10px #ff0000";
                
                if (showCountdown && targetTime) {
                    startCountdown(targetTime.getTime());
                } else {
                    if (countdownInterval) clearInterval(countdownInterval);
                    countdownBox.style.display = "none";
                }
            }

            // Deaktivace červeného módu (odemknutí webu a odsunutí loaderu)
            function disableMaintenanceView() {
                if (countdownInterval) clearInterval(countdownInterval);
                countdownBox.style.display = "none";

                loaderLogo.classList.remove('logo-maintenance');
                progressBar.classList.remove('bar-maintenance');
                
                loaderText.style.color = "#00c853";
                loaderText.style.textShadow = "0 0 5px #00c853";

                // Odsuneme loader nahoru a ukážeme obsah
                mainContent.style.display = 'flex';
                loaderOverlay.classList.add('loader-hide');
            }

            // Hlavní kontrolní funkce spouštěná periodicky
            async function checkSystemStatus() {
                try {
                    const response = await fetch('maintenance.json?t=' + Date.now());
                    if (!response.ok) throw new Error();
                    const data = await response.json();

                    const now = new Date();
                    const startTime = parseDateString(data.start);
                    const endTime = parseDateString(data.end);

                    let isMaintenance = false;
                    let statusText = "MAINTENANCE MODE";

                    const maintenanceTimeOver = (endTime && now > endTime);

                    if (!maintenanceTimeOver) {
                        if (data.forced === true) {
                            isMaintenance = true;
                        } else if (startTime && endTime && now >= startTime && now <= endTime) {
                            isMaintenance = true;
                            const options = { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' };
                            statusText = `ÚDRŽBA DO ${endTime.toLocaleDateString('cs-CZ', options)}`;
                        }
                    }

                    // Detekce změny stavu
                    if (isMaintenance) {
                        currentMaintenanceState = true;
                        const showCountdown = (data["show-endtime"] && endTime && endTime > now);
                        
                        if (!isInitiallyLoaded) {
                            await simulateLoading(100, "Prověřování systému");
                            isInitiallyLoaded = true;
                        }
                        enableMaintenanceView(statusText, endTime, showCountdown);
                    } else {
                        // Pokud údržba neběží
                        if (!isInitiallyLoaded) {
                            await simulateLoading(100);
                            isInitiallyLoaded = true;
                        }
                        
                        // Pokud systém zrovna přešel z údržby do normálu, odemkneme web
                        if (currentMaintenanceState || loaderOverlay.style.display !== 'none') {
                            currentMaintenanceState = false;
                            disableMaintenanceView();
                        }
                    }

                } catch (e) {
                    // V případě výpadku sítě nebo smazání JSONu
                    if (countdownInterval) clearInterval(countdownInterval);
                    enableMaintenanceView("CHYBA SYSTÉMU", null, false);
                }
            }

            async function init() {
                // První fake loading po startu stránky
                await simulateLoading(35);
                // První kontrola verze sítě
                await checkSystemStatus();

                // SMRTIČ/KICKER: Každých 5000ms (5 vteřin) na pozadí ověří stav sítě.
                // Pokud změníš JSON, uživatele to vykopne do 5 vteřin bez ohledu na to, kde na webu je.
                checkStatusInterval = setInterval(checkSystemStatus, 5000);
            }

            window.onload = init;
        })();
    </script>
</body>
</html>
