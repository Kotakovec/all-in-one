<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KotakEngine</title>
    <style>
        /* Základní reset a temný design */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a0a0a;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        /* Glitchující pozadí */
        .glitch-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            opacity: 0.15;
            animation: bg-glitch 0.2s infinite;
        }

        .glitch-blocks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: no-repeat;
        }

        .glitch-blocks::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #111;
            opacity: 0;
            animation: flash 4s infinite;
        }

        /* Pravý horní roh - Login */
        .header-actions {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }

        .login-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #222;
            border: 2px solid #333;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .login-btn:hover {
            border-color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            transform: scale(1.05);
        }

        .login-btn svg {
            width: 22px;
            height: 22px;
            fill: #aaa;
            transition: fill 0.3s ease;
        }

        .login-btn:hover svg {
            fill: #00ffcc;
        }

        /* Hlavní kontejner uprostřed */
        .main-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Nadpis KotakEngine */
        .brand-title {
            font-size: 5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 5px;
            position: relative;
            color: #fff;
            text-shadow: 0px 0px 20px rgba(255,255,255,0.1);
        }

        /* Minecraft Splash Text pod nadpisem vlevo */
        .splash-wrapper {
            width: 100%;
            position: relative;
            height: 40px;
            margin-top: -10px;
            margin-bottom: 40px;
        }

        .minecraft-splash {
            position: absolute;
            left: 15%; /* Pozice mírně vlevo pod nápisem */
            color: #ff5555; /* Minecraft žlutá, upraveno pro kontrast */
            color: #ffff55; 
            font-family: 'Arial Black', Gadget, sans-serif;
            font-size: 1.6rem;
            font-weight: bold;
            text-shadow: 2px 2px 0px #3f3f00;
            transform: rotate(-15deg);
            display: inline-block;
            animation: splash-jump 0.5s infinite alternate;
            white-space: nowrap;
        }

        /* Tlačítko ENTER */
        .enter-btn {
            padding: 15px 50px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #fff;
            background: transparent;
            border: 2px solid #fff;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255,255,255,0.05);
        }

        .enter-btn:hover {
            color: #000;
            background: #fff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        .enter-btn:active {
            transform: translateY(1px);
        }

        /* ANIMACE */
        @keyframes bg-glitch {
            0% { background-position: 0 0; }
            100% { background-position: 0 5px; }
        }

        @keyframes flash {
            0%, 94%, 98%, 100% { opacity: 0; }
            95%, 97% { opacity: 0.03; }
        }

        @keyframes splash-jump {
            0% {
                transform: rotate(-15deg) scale(1);
            }
            100% {
                transform: rotate(-15deg) scale(1.12);
            }
        }
    </style>
</head>
<body>

    <!-- Glitch efekty na pozadí -->
    <div class="glitch-bg"></div>
    <div class="glitch-blocks"></div>

    <!-- Login ikona vpravo nahoře -->
    <div class="header-actions">
        <button class="login-btn" title="Přihlásit se">
            <svg viewBox="0 0 24 24">
                <path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z" />
            </svg>
        </button>
    </div>

    <!-- Hlavní obsah -->
    <div class="main-container">
        <h1 class="brand-title">KotakEngine</h1>
        
        <div class="splash-wrapper">
            <span class="minecraft-splash">by Kotakovec</span>
        </div>
        
        <button class="enter-btn">Enter</button>
    </div>

</body>
</html>
